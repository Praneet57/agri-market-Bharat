<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Profile – AgriMarket</title><link rel="stylesheet" href="/static/css/style.css"/></head>
<body>
<nav class="navbar"><a class="navbar-brand" href="/"><span>🌾</span> AgriMarket</a>
  <div style="display:flex;align-items:center;gap:1rem"><a id="nav-dash" href="#" style="color:rgba(255,255,255,.8);text-decoration:none;font-size:.9rem">← Dashboard</a><a href="#" onclick="logout()" style="color:rgba(255,255,255,.7);font-size:.85rem;text-decoration:none">Logout</a></div>
</nav>
<div style="max-width:700px;margin:2rem auto;padding:0 1.5rem">
  <h2 class="section-title">👤 My Profile</h2>
  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-body" style="display:flex;align-items:center;gap:1.5rem;padding:1.5rem">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:white;font-size:2rem;font-weight:700;flex-shrink:0" id="avatar">U</div>
      <div><div style="font-size:1.3rem;font-weight:700" id="disp-name">Loading…</div><div class="text-muted" id="disp-role"></div><div class="text-sm text-muted" id="disp-phone"></div><div style="margin-top:.4rem" id="disp-verified"></div></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-header"><strong>Edit Profile</strong></div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group" style="grid-column:1/-1"><label>Full Name</label><input type="text" id="pf-name" class="form-control"/></div>
        <div class="form-group"><label>Email</label><input type="email" id="pf-email" class="form-control" placeholder="Optional"/></div>
        <div class="form-group"><label>Phone (read-only)</label><input type="tel" id="pf-phone" class="form-control" readonly style="background:#f5f5f5"/></div>
        <div class="form-group"><label>Village</label><input type="text" id="pf-village" class="form-control"/></div>
        <div class="form-group"><label>District</label><input type="text" id="pf-district" class="form-control"/></div>
        <div class="form-group" style="grid-column:1/-1"><label>Bio</label><textarea id="pf-bio" class="form-control" rows="3" placeholder="Tell others about yourself…"></textarea></div>
      </div>
      <button class="btn btn-green" id="save-btn" onclick="saveProfile()">Save Changes</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-header"><strong>🔒 Security</strong></div>
    <div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group"><label>Current Password</label><input type="password" id="cur-pwd" class="form-control" placeholder="Current password"/></div>
        <div></div>
        <div class="form-group"><label>New Password</label><input type="password" id="new-pwd" class="form-control" placeholder="Min 6 chars"/></div>
        <div class="form-group"><label>Confirm New Password</label><input type="password" id="con-pwd" class="form-control" placeholder="Repeat"/></div>
      </div>
      <button class="btn btn-amber" onclick="changePwd()">Change Password</button>
      <hr class="divider"/>
      <div class="row-between"><div><strong>Active Sessions</strong><div class="text-sm text-muted" id="sessions-info">Checking…</div></div><button class="btn btn-danger btn-sm" onclick="logoutAll()">Logout All Devices</button></div>
    </div>
  </div>
  <div class="card" id="verify-card" style="display:none;margin-bottom:1.5rem">
    <div class="card-header"><strong>📱 Phone Verification</strong></div>
    <div class="card-body">
      <p class="text-sm text-muted" style="margin-bottom:1rem">Verify your phone to build trust with others.</p>
      <button class="btn btn-green btn-sm" onclick="sendVerif()">Send Verification Token</button>
      <div id="verif-input" style="display:none;margin-top:1rem">
        <div class="form-group"><label>Token</label><input type="text" id="verif-token" class="form-control" placeholder="Paste token…"/></div>
        <button class="btn btn-green btn-sm" onclick="verifyPhone()">Verify Phone</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/api.js"></script>
<script>
if(!requireAuth())throw new Error();
const user=getUser();
document.getElementById("nav-dash").href=user.role==="farmer"?"/farmer/dashboard.html":"/buyer/dashboard.html";
async function loadProfile(){
  try{
    const u=await API.me();
    document.getElementById("avatar").textContent=u.full_name[0].toUpperCase();
    document.getElementById("disp-name").textContent=u.full_name;
    document.getElementById("disp-role").textContent=u.role.charAt(0).toUpperCase()+u.role.slice(1);
    document.getElementById("disp-phone").textContent=u.phone;
    document.getElementById("disp-verified").innerHTML=u.is_verified?'<span style="color:var(--green);font-size:.85rem">✅ Verified</span>':'<span style="color:var(--amber);font-size:.85rem">⚠️ Not verified</span>';
    document.getElementById("pf-name").value=u.full_name||"";document.getElementById("pf-email").value=u.email||"";document.getElementById("pf-phone").value=u.phone||"";document.getElementById("pf-village").value=u.village||"";document.getElementById("pf-district").value=u.district||"";document.getElementById("pf-bio").value=u.bio||"";
    if(!u.is_verified)document.getElementById("verify-card").style.display="block";
    const s=await API.sessions();document.getElementById("sessions-info").textContent=`${s.active_sessions} active session(s)`;
  }catch(e){showToast(e.message,"error")}
}
async function saveProfile(){
  const btn=document.getElementById("save-btn");btn.innerHTML='<span class="loader"></span>';btn.disabled=true;
  try{await API.updateMe({full_name:document.getElementById("pf-name").value,email:document.getElementById("pf-email").value||null,bio:document.getElementById("pf-bio").value||null,village:document.getElementById("pf-village").value||null,district:document.getElementById("pf-district").value||null});showToast("Profile updated! ✅","success");loadProfile()}
  catch(e){showToast(e.message,"error")}finally{btn.innerHTML="Save Changes";btn.disabled=false}
}
async function changePwd(){
  const cur=document.getElementById("cur-pwd").value,nw=document.getElementById("new-pwd").value,con=document.getElementById("con-pwd").value;
  if(!cur||!nw){showToast("Fill in all password fields","error");return}
  if(nw!==con){showToast("Passwords don't match","error");return}
  if(nw.length<6){showToast("Min 6 characters","error");return}
  try{await API.changePassword({current_password:cur,new_password:nw});showToast("Password changed! Please login again.","success");setTimeout(()=>{clearAuth();window.location.href="/login.html"},1500)}catch(e){showToast(e.message,"error")}
}
async function logoutAll(){
  if(!confirm("Sign out of all devices?"))return;
  try{await API.logoutAll();showToast("All sessions terminated","info");setTimeout(()=>{clearAuth();window.location.href="/login.html"},1200)}catch(e){showToast(e.message,"error")}
}
async function sendVerif(){
  try{const r=await API.sendVerification();showToast("Token ready!","success");document.getElementById("verif-input").style.display="block";if(r.verify_token){document.getElementById("verif-token").value=r.verify_token;showToast("Token auto-filled (demo mode)","info")}}catch(e){showToast(e.message,"error")}
}
async function verifyPhone(){
  const t=document.getElementById("verif-token").value.trim();
  if(!t){showToast("Enter token","error");return}
  try{await API.verifyPhone(t);showToast("Phone verified! ✅","success");document.getElementById("verify-card").style.display="none";loadProfile()}catch(e){showToast(e.message,"error")}
}
loadProfile();
</script></body></html>

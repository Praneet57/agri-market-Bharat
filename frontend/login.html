<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Login – AgriMarket</title><link rel="stylesheet" href="/static/css/style.css"/></head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="icon">🌾</div><h1>AgriMarket</h1><p style="color:var(--muted);font-size:.9rem;margin-top:.25rem">Sign in to your account</p></div>
    <div id="err" style="display:none;background:#fce4ec;color:#c62828;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem"></div>
    <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" class="form-control" placeholder="Enter your phone number"/></div>
    <div class="form-group"><label>Password</label>
      <div style="position:relative"><input type="password" id="password" class="form-control" placeholder="Enter your password" style="padding-right:2.5rem"/><span onclick="togglePwd()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);cursor:pointer" id="eye">👁</span></div>
    </div>
    <button class="btn btn-green btn-full mt-2" id="btn" onclick="doLogin()">Sign In</button>
    <div class="text-center mt-2" style="font-size:.9rem;color:var(--muted)">Don't have an account? <a href="/register.html" style="color:var(--green);font-weight:600">Register Free</a></div>
    <div class="divider"></div>
    <div style="background:#f5f5f5;border-radius:8px;padding:.75rem;font-size:.82rem;color:var(--muted)"><strong>Demo accounts:</strong><br>Farmer: 9000000001 / farmer123<br>Buyer: 9000000002 / buyer123</div>
  </div>
</div>
<script src="/static/js/api.js?v=2"></script>
<script>
redirectIfLoggedIn();
function togglePwd(){const p=document.getElementById("password"),e=document.getElementById("eye");p.type=p.type==="password"?"text":"password";e.textContent=p.type==="password"?"👁":"🙈"}
document.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
async function doLogin(){
  const phone=document.getElementById("phone").value.trim(),password=document.getElementById("password").value,err=document.getElementById("err"),btn=document.getElementById("btn");
  err.style.display="none";
  if(!phone||!password){err.textContent="Please fill in all fields.";err.style.display="block";return}
  btn.innerHTML='<span class="loader"></span> Signing in…';btn.disabled=true;
  try{
    const data=await API.login({phone,password});
    if(!data || !data.access_token || !data.user){
      throw new Error("Login failed. Please try again.");
    }
    setAuth(data.access_token,data.refresh_token,data.user);
    showToast("Welcome back, "+data.user.full_name+"! 👋","success");
    setTimeout(()=>{
      window.location.href=
        data.user.role==="admin"?"/admin/dashboard.html":(data.user.role==="farmer"?"/farmer/dashboard.html":"/buyer/dashboard.html")
    },600);
  }catch(e){err.textContent=e.message||"Login failed";err.style.display="block";btn.innerHTML="Sign In";btn.disabled=false}

}
</script></body></html>
